[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octobot-trading"
version = "2.5.13"
description = "OctoBot project trading package"
readme = "README.md"
license = "LGPL-3.0"
requires-python = ">=3.13"
authors = [
    { name = "Drakkar-Software", email = "contact@drakkar.software" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
]
dependencies = [
    "numpy",
    "octobot-backtesting",
    "async-channel",
    "octobot-commons",
    "octobot-tentacles-manager>=2.10.0",
    "trading-backend>=1.2.43",
    "ccxt",
    "cryptography",
    "ecdsa",
    "sortedcontainers",
    "cachetools",
]

[project.optional-dependencies]
full = [
    "octobot-backtesting[full]",
    "octobot-commons[full]",
    "octobot-tentacles-manager[full]",
    "tinydb",
]

[project.urls]
Homepage = "https://github.com/Drakkar-Software/OctoBot-Trading"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "mock",
    "ruff",
]

[tool.uv]
override-dependencies = ["ccxt>=4.5.85", "aioboto3>=15", "aiofiles>=25"]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/octobot_trading"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["octobot_trading"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]

[tool.uv.sources]
"octobot-commons" = { path = "../OctoBot-Commons", editable = true }
"octobot-backtesting" = { path = "../OctoBot-Backtesting", editable = true }
"trading-backend" = { path = "vendor/trading-backend", editable = true }
"octobot-tentacles-manager" = { path = "../OctoBot-Evaluators/vendor/tentacles-manager", editable = true }
